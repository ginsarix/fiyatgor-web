<!doctype html>
<html lang="tr">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" href="/favicon.jpeg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="/src/style.css" />
        <title>Fiyat Gör</title>
    </head>
    <body
        class="min-h-dvh bg-[#6b7db3] flex flex-col items-center justify-center relative overflow-hidden transition-colors"
    >
        <!-- Parçacıklar -->
        <canvas
            id="particles"
            class="absolute inset-0 w-full h-full pointer-events-none"
        ></canvas>

        <!-- Dalga -->
        <div class="absolute bottom-0 left-0 w-full pointer-events-none">
            <svg
                viewBox="0 0 1440 320"
                xmlns="http://www.w3.org/2000/svg"
                preserveAspectRatio="none"
                class="w-full h-[22vw] min-h-45 max-h-80 block"
            >
                <title>Dalga Dekorasyonu</title>
                <path
                    d="M0,180 C200,340 400,60 720,200 C1040,340 1240,60 1440,180 L1440,320 L0,320 Z"
                    fill="#d8dce8"
                />
            </svg>
        </div>

        <main
            class="relative z-10 flex flex-col items-center gap-3 w-full max-w-xs -mt-30"
        >
            <img
                src="/company.png"
                alt="Şirket Logo"
                class="h-24 object-contain"
            />
            <div class="bg-white rounded-xl shadow-2xl w-full px-6 py-8">
                <input
                    id="barcode-input"
                    type="text"
                    placeholder="Barkod"
                    autofocus
                    autocomplete="off"
                    class="w-full border border-gray-300 rounded-lg py-3 px-4 text-center text-lg text-gray-800 placeholder-gray-400 outline-none focus:border-gray-500 transition-colors duration-200"
                />
                <div
                    id="result-wrapper"
                    class="grid transition-[grid-template-rows] duration-300 ease-in-out"
                    style="grid-template-rows: 0fr"
                >
                    <div class="overflow-hidden">
                        <div
                            class="mt-4 grid text-2xl"
                            style="grid-template-areas: &quot;stack&quot;"
                        >
                            <div
                                id="loader-container"
                                class="[grid-area:stack] flex items-center justify-center transition-all duration-300 ease-in-out opacity-0 scale-90 pointer-events-none"
                            >
                                <svg
                                    xmlns="http://www.w3.org/2000/svg"
                                    width="24"
                                    height="24"
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    stroke="currentColor"
                                    stroke-width="2"
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    class="animate-spin text-blue-500"
                                >
                                    <title>Yükleniyor Simgesi</title>
                                    <path d="M21 12a9 9 0 1 1-6.219-8.56" />
                                </svg>
                            </div>

                            <div
                                id="product-content"
                                class="[grid-area:stack] flex flex-col items-center text-center transition-all duration-300 ease-in-out opacity-0 scale-90 pointer-events-none"
                            >
                                <span
                                    id="product-name"
                                    class="font-medium text-gray-800"
                                ></span>
                                <div
                                    id="discount-badge"
                                    class="hidden mt-1.5 inline-flex max-w-full items-center gap-1 rounded-md border border-red-200 bg-red-50 px-2 py-1 text-xs font-semibold text-red-600"
                                >
                                    <svg
                                        xmlns="http://www.w3.org/2000/svg"
                                        width="13"
                                        height="13"
                                        viewBox="0 0 24 24"
                                        fill="none"
                                        stroke="currentColor"
                                        stroke-width="2"
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        class="shrink-0"
                                    >
                                        <title>Kampanya Simgesi</title>
                                        <path
                                            d="M20.59 13.41 11 3.83A2 2 0 0 0 9.59 3.24L4 3a1 1 0 0 0-1 1l.24 5.59a2 2 0 0 0 .59 1.41l9.58 9.59a2 2 0 0 0 2.83 0l4.35-4.35a2 2 0 0 0 0-2.83Z"
                                        />
                                        <circle cx="7.5" cy="7.5" r="1.5" />
                                    </svg>
                                    <span id="discount-detail"></span>
                                </div>
                                <span
                                    id="product-original-price"
                                    class="hidden text-sm font-medium text-gray-400 line-through"
                                ></span>
                                <span
                                    id="product-price"
                                    class="font-extrabold text-gray-800"
                                ></span>
                                <span
                                    id="discount-ends-at"
                                    class="hidden text-xs text-gray-400"
                                ></span>
                            </div>
                        </div>
                    </div>
                </div>
                <audio
                    id="success-audio"
                    src="/audio/success.mp3"
                    preload="auto"
                ></audio>
                <audio
                    id="error-audio"
                    src="/audio/error.mp3"
                    preload="auto"
                ></audio>
            </div>

            <!-- Scanner (inline, below the card) -->
            <div id="scanner-container" class="hidden w-full">
                <!-- Shown before camera is active; acts as the user-gesture trigger -->
                <button
                    id="scanner-start"
                    type="button"
                    class="hidden w-full rounded-xl bg-white/15 text-white py-6 text-sm font-medium tracking-wide cursor-pointer hover:bg-white/25 active:bg-white/30 transition-colors"
                >
                    Kamera ile tara
                </button>
                <!-- Shown while camera is active -->
                <div id="scanner-active" class="hidden">
                    <div class="relative">
                        <video
                            id="scanner-video"
                            class="w-full rounded-xl max-h-[40dvh] object-cover"
                            playsinline
                            muted
                        ></video>
                        <!-- Corner brackets -->
                        <div class="absolute inset-0 pointer-events-none">
                            <div
                                class="absolute top-3 left-3 w-7 h-7 border-t-2 border-l-2 border-white rounded-tl-lg"
                            ></div>
                            <div
                                class="absolute top-3 right-3 w-7 h-7 border-t-2 border-r-2 border-white rounded-tr-lg"
                            ></div>
                            <div
                                class="absolute bottom-3 left-3 w-7 h-7 border-b-2 border-l-2 border-white rounded-bl-lg"
                            ></div>
                            <div
                                class="absolute bottom-3 right-3 w-7 h-7 border-b-2 border-r-2 border-white rounded-br-lg"
                            ></div>
                        </div>
                    </div>
                </div>
                <div class="text-center mt-2">
                    <button
                        id="scanner-close"
                        type="button"
                        class="hidden text-white/70 hover:text-white text-xs transition-colors cursor-pointer"
                    >
                        Kapat
                    </button>
                </div>
            </div>
        </main>

        <footer class="absolute bottom-4 text-center text-xs space-y-1 z-10">
            <div class="flex items-center justify-center gap-3">
                <a
                    href="https://admin.fiyatgor.panunet.com.tr"
                    class="text-[#405189] hover:text-white transition-colors"
                    >Yönetim</a
                >
                <a
                    id="scanner-trigger"
                    href="#"
                    class="text-[#405189] hover:text-white transition-colors"
                    >Kamera İle Tara</a
                >
            </div>
            <div>
                <span id="footer-year">
                    <script>
                        document.write(new Date().getFullYear());
                    </script>
                </span>
                PanuNet Fiyat Gör · Panu Teknoloji
            </div>
        </footer>

        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
